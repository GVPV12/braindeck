name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm toma la versión del campo "packageManager" de package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas de humo
        run: pnpm exec playwright test tests/smoke.spec.js
      - name: Auditoría de traducciones (informativa)
        run: pnpm exec playwright test tests/i18n.spec.js --reporter=list
        continue-on-error: true
